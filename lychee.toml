# Lychee link checker config.
# Internal-only: validates relative file paths and anchors between markdown
# files. External http(s) URLs are not requested (no network flakiness in CI).

offline = true

exclude_path = [
  "node_modules",
  ".git",
  "bin",
  "dist",
  "tmp",
  "coverage.html",
  # Concatenation of Run 1 spike artifacts (brief.md + t5-run-1-conclusions.md)
  # — inherits relative links that don't resolve from inside caching-bench/.
  "docs/gstack/week-1-spike/caching-bench/workload.md",
]
