# Boot-only smoke — minimal stack to validate:
#   1. OpenClaw container builds (npm install -g openclaw@<pin>)
#   2. Gateway starts with single-agent config (no MCP, no channels)
#   3. Anthropic API call lands + OTel spans emit
#   4. T9' parity: kql/03-per-agent-cost.kql returns populated cache columns
#
# Not a 2-agent run. Just the cheapest possible validation that the most
# load-bearing assumptions hold before investing in the full 4-agent scaffold.

services:

  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile.openclaw
      args:
        OPENCLAW_VERSION: ${OPENCLAW_VERSION:-2026.5.20}
    container_name: openclaw-boot-smoke
    restart: "no"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set in .env.smoke}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: openclaw-gateway
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=week-1.5-boot-smoke"
      # Gateway refuses to bind 0.0.0.0 unauthenticated in a container.
      # Static token — fine for boot smoke, never reused outside this stack.
      OPENCLAW_GATEWAY_TOKEN: boot-smoke-${COMPOSE_PROJECT_NAME:-local}
    # OpenClaw looks at ~/.openclaw/openclaw.json (printed by `openclaw config file`).
    # OPENCLAW_CONFIG_PATH is profile-scoped only — not honored standalone — so we
    # mount our JSON5 at the canonical path. State (sessions/logs) goes to the
    # named volume so a fresh run wipes cleanly via `down -v`.
    volumes:
      - ./agents/openclaw.boot-smoke.json:/root/.openclaw/openclaw.json:ro
      - openclaw-state:/root/.openclaw/state
    networks: [smoke]
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: otel-collector-boot-smoke
    volumes:
      - ./otel-collector-boot-smoke.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      # Collector config (week-1-spike/.../config.yaml) references AZURE_MONITOR_CONNECTION_STRING.
      AZURE_MONITOR_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:?set in .env.smoke}
    networks: [smoke]

volumes:
  openclaw-state:

networks:
  smoke:
    driver: bridge
