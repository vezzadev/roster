# Week 1 validation spike runtime.
#
# Stand up outside the repo — copy this directory to e.g. ~/spike-runtime/
# before `docker compose up`. Host bind-mounts and Docker volumes hold
# Nextcloud's /agents/ and /founder/ folders that the contamination guard
# partitions; keeping the runtime working tree separate from the repo
# avoids accidental commit of run-time data.
#
# Bring-up sequence (manual per Week 1 "no CLI" spec):
#   1. cp .env.example .env  &&  chmod 600 .env  &&  edit .env
#   2. docker compose up -d nc-db nc-redis nextcloud
#      → wait ~30s for Nextcloud first-run init
#   3. docker compose exec --user www-data nextcloud php occ app:install spreed
#   4. In the Nextcloud admin UI (http://localhost:8080), create users:
#        em, researcher                     (Run 1 — post-swap pairing)
#        analyst-a, analyst-b               (Run 2 adds these two)
#      Generate one app-password per user.
#   5. Create folders /agents/ and /founder/. Set ACLs per
#      ../t4-mcp-investigation.md "Network and ACL policy":
#        /agents/   read+write to all present agent users
#        /founder/  read+write to admin/founder only; invisible to agents
#      Verify by logging in as each agent user — /founder/ must not appear.
#   6. Create Talk rooms per ../t5-system-prompts.md:
#        #team           (all present agents)
#        EM-Researcher   (em + researcher)                       (Run 1)
#        EM-A, EM-B, A-B, A-Researcher, B-Researcher             (Run 2 adds these)
#   7. docker compose up -d letta nextcloud-mcp-em \
#                            nextcloud-mcp-researcher researcher-web-mcp
#   8. Wire each Letta agent to its frozen prompt from
#      ../t5-system-prompts.md via spike-compose/wire-run-1.py. The script's
#      pre-create gates re-verify SHA-256 hashes against the Hash protocol
#      in that file and re-run the banned-token grep (0 hits). Both gates →
#      record in ../t5-run-ledger.md "Prompts frozen at hash".
#   9. Capture container digests into ../t5-env-manifest.md Run N row:
#        docker compose images
#   10. spike-compose/probe-tools.py runs an identity-isolated tool-exec
#       probe per agent (talk_send_message + nc_webdav_write_file). All
#       probes must pass before the kickoff message goes out.
#   11. Boot agents → Run 1 (1h hard cap). For Run 2: uncomment the
#       nextcloud-mcp-analyst-b service below, repeat steps 4-8 for the
#       additional users + agents, and the Squid proxy stays optional
#       (the researcher-web wrapper already enforces the contamination
#       blocklist on the only web-fetch surface).

services:
  nc-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NC_DB_PASSWORD:?set NC_DB_PASSWORD in .env}
    volumes:
      - nc_db_data:/var/lib/postgresql/data
    networks: [spike]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud"]
      interval: 10s
      timeout: 3s
      retries: 5

  nc-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    networks: [spike]

  nextcloud:
    image: nextcloud:30
    restart: unless-stopped
    depends_on:
      nc-db:
        condition: service_healthy
      nc-redis:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"   # bind localhost only; admin UI is not for the internet
    environment:
      POSTGRES_HOST: nc-db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NC_DB_PASSWORD:?set NC_DB_PASSWORD in .env}
      REDIS_HOST: nc-redis
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:?set NC_ADMIN_PASSWORD in .env}
      # `nextcloud` must be trusted because the MCP containers reach the
      # server over the internal Docker bridge under that hostname — without
      # it, every spreed/WebDAV request from MCP returns the "Access through
      # untrusted domain" page (HTTP 400). Multi-value: space-separated.
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost nextcloud"
    volumes:
      - nc_data:/var/www/html
    networks: [spike]

  # One Letta container per agent — discovered pre-Run-1 (see ../t5-run-ledger.md
  # "Letta tool-namespace finding") that Letta dedupes MCP tools by name globally
  # within a single Letta instance, so a singleton Letta with multiple per-agent
  # MCPs collapses `talk_send_message` (and every other duplicate-named tool)
  # onto a single binding that points at the most-recently-registered MCP,
  # silently breaking identity isolation. Per-Letta-per-agent eliminates the
  # collision at the architecture level: each Letta only registers its agent's
  # own MCPs, so no two MCPs ever expose the same tool name to the same Letta.
  #
  # Each Letta is named `letta-<role>`; the operator interacts with it on a
  # dedicated host port (8283 + role offset). The internal port stays 8283 in
  # every container. The shared `letta_<role>_data` volume holds that Letta's
  # sqlite agent state. Every Letta also bind-mounts the same SSRF patch.
  #
  # OPENROUTER_API_KEY and LETTA_SERVER_PASSWORD are sourced from the gitignored
  # ./openrouter.local and ./letta.local files by ./bring-up.sh. The same
  # password is shared across all Letta instances — they don't share state, just
  # the operator credential.

  letta-em:
    image: letta/letta:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8283:8283"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?run ./bring-up.sh — sources ./openrouter.local}
      SECURE: "true"
      LETTA_SERVER_PASSWORD: ${LETTA_SERVER_PASSWORD:?run ./bring-up.sh — sources ./letta.local}
    volumes:
      - letta_em_data:/root/.letta
      # The Letta image bundles postgres internally and stores all agent state
      # at /var/lib/postgresql/data. Without this mount, agent state is in the
      # container's writable layer and dies on `docker compose down` — the
      # /root/.letta mount only catches the bootstrap [defaults] config. See
      # ../t5-run-ledger.md "Run 1 state loss" for the original incident.
      - letta_em_pgdata:/var/lib/postgresql/data
      - ./letta-patches/url_validation.py:/app/letta/helpers/url_validation.py:ro
    networks: [spike]

  letta-researcher:
    image: letta/letta:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8284:8283"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?run ./bring-up.sh — sources ./openrouter.local}
      SECURE: "true"
      LETTA_SERVER_PASSWORD: ${LETTA_SERVER_PASSWORD:?run ./bring-up.sh — sources ./letta.local}
    volumes:
      - letta_researcher_data:/root/.letta
      - letta_researcher_pgdata:/var/lib/postgresql/data
      - ./letta-patches/url_validation.py:/app/letta/helpers/url_validation.py:ro
    networks: [spike]

  # ─── Run 2 only — uncomment alongside the matching nextcloud-mcp-<role> sidecars
  #
  # letta-analyst-a:
  #   image: letta/letta:latest
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:8285:8283"
  #   environment:
  #     OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?run ./bring-up.sh — sources ./openrouter.local}
  #     SECURE: "true"
  #     LETTA_SERVER_PASSWORD: ${LETTA_SERVER_PASSWORD:?run ./bring-up.sh — sources ./letta.local}
  #   volumes:
  #     - letta_analyst_a_data:/root/.letta
  #     - ./letta-patches/url_validation.py:/app/letta/helpers/url_validation.py:ro
  #   networks: [spike]
  #
  # letta-analyst-b:
  #   image: letta/letta:latest
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:8286:8283"
  #   environment:
  #     OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?run ./bring-up.sh — sources ./openrouter.local}
  #     SECURE: "true"
  #     LETTA_SERVER_PASSWORD: ${LETTA_SERVER_PASSWORD:?run ./bring-up.sh — sources ./letta.local}
  #   volumes:
  #     - letta_analyst_b_data:/root/.letta
  #     - ./letta-patches/url_validation.py:/app/letta/helpers/url_validation.py:ro
  #   networks: [spike]

  # MCP sidecars. The cbcoutinho image (AGPL-3.0, per ../t4-mcp-investigation.md
  # "Decision") authenticates as a single Nextcloud user via NEXTCLOUD_USERNAME +
  # NEXTCLOUD_PASSWORD env. Each MCP container is the sidecar for exactly one
  # Letta — the matching letta-<role> container above. The MCP is reachable on
  # the internal `spike` network and is registered only with its paired Letta;
  # no other Letta sees its tools, which is what makes identity isolation work.
  # The app token for each user is sourced from a gitignored ./<role>-token.local
  # by ./bring-up.sh; if the token file is missing the MCP fails fast for that
  # role only.
  # Transport: streamable_http on :8000/mcp (only HTTP transport this image
  # supports; SSE was deprecated upstream). Port not exposed to the host.

  nextcloud-mcp-em:  # sidecar to letta-em
    image: ghcr.io/cbcoutinho/nextcloud-mcp-server:latest
    restart: unless-stopped
    depends_on: [nextcloud]
    environment:
      NEXTCLOUD_HOST: http://nextcloud
      NEXTCLOUD_USERNAME: em
      NEXTCLOUD_PASSWORD: ${EM_APP_TOKEN:?run ./bring-up.sh — sources ./em-token.local}
    networks: [spike]

  nextcloud-mcp-analyst-a:  # sidecar to letta-analyst-a (Run 2)
    image: ghcr.io/cbcoutinho/nextcloud-mcp-server:latest
    restart: unless-stopped
    depends_on: [nextcloud]
    environment:
      NEXTCLOUD_HOST: http://nextcloud
      NEXTCLOUD_USERNAME: analyst-a
      NEXTCLOUD_PASSWORD: ${ANALYST_A_APP_TOKEN:?run ./bring-up.sh — sources ./analyst-a-token.local}
    networks: [spike]

  # Wrapper MCP exposing two tools to the Researcher: web_search + web_scrape.
  # Forwards to Firecrawl SaaS, but enforces the contamination blocklist
  # server-side per ../t4-mcp-investigation.md "Researcher domain blocklist".
  # Reason this wrapper exists rather than handing the Researcher the
  # firecrawl-mcp tools directly: Firecrawl's /v2/scrape endpoint has no
  # excludeDomains parameter — only /v2/search does. Without this wrapper an
  # agent calling scrape(bcg.com) would bypass every contamination guard.
  #
  # blocklist.txt is checked-in (committed-in-repo source of truth alongside
  # t4). audit/fetch.jsonl is gitignored — that's the per-run trail copied to
  # ../t5-researcher-urls.md after Run 2.
  researcher-web-mcp:  # sidecar to letta-researcher
    build: ./researcher-web-mcp
    restart: unless-stopped
    environment:
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:?run ./bring-up.sh — sources ./firecrawl.local}
      BLOCKLIST_PATH: /etc/researcher-web/blocklist.txt
      AUDIT_PATH: /var/log/researcher-web/fetch.jsonl
    volumes:
      - ./researcher-web-mcp/blocklist.txt:/etc/researcher-web/blocklist.txt:ro
      - ./researcher-web-mcp/audit:/var/log/researcher-web
    networks: [spike]

  # Researcher MCP: live from Run 1 (post-swap). letta-researcher attaches both
  # this nextcloud-mcp sidecar and the researcher-web wrapper above.
  nextcloud-mcp-researcher:  # sidecar to letta-researcher
    image: ghcr.io/cbcoutinho/nextcloud-mcp-server:latest
    restart: unless-stopped
    depends_on: [nextcloud]
    environment:
      NEXTCLOUD_HOST: http://nextcloud
      NEXTCLOUD_USERNAME: researcher
      NEXTCLOUD_PASSWORD: ${RESEARCHER_APP_TOKEN:?run ./bring-up.sh — sources ./researcher-token.local}
    networks: [spike]

  # ─── Run 2 only — bring up after analyst-b exists in Nextcloud
  # and the app token is stashed in ./analyst-b-token.local
  #
  # nextcloud-mcp-analyst-b:
  #   image: ghcr.io/cbcoutinho/nextcloud-mcp-server:latest
  #   restart: unless-stopped
  #   depends_on: [nextcloud]
  #   environment:
  #     NEXTCLOUD_HOST: http://nextcloud
  #     NEXTCLOUD_USERNAME: analyst-b
  #     NEXTCLOUD_PASSWORD: ${ANALYST_B_APP_TOKEN:?run ./bring-up.sh — sources ./analyst-b-token.local}
  #   networks: [spike]

  # ─── Run 2 only — uncomment + verify before booting Run 2 ────────────────
  #
  # squid:
  #   image: ubuntu/squid:latest
  #   restart: unless-stopped
  #   volumes:
  #     - ./squid/squid.conf:/etc/squid/squid.conf:ro
  #     - ./squid/blocklist.txt:/etc/squid/blocklist.txt:ro
  #   networks: [spike]
  #
  # Per ../t4-mcp-investigation.md "Network and ACL policy":
  #   - ./squid/blocklist.txt holds one `dstdomain` entry per line for the
  #     consulting-firm domains in t4 + their archive/mirror paths.
  #   - Set HTTP_PROXY=http://squid:3128 on the Researcher's URL-fetch
  #     surface (likely a sidecar to the Letta runtime, or the Researcher
  #     agent's tool definition if its MCP web-fetch supports proxy env).
  #   - Run the four `curl -x` verification checks from t4
  #     "Verification checklist (before Run 1)" — copy results into the
  #     ../t5-run-ledger.md "Run 2 setup" notes.

networks:
  spike:
    driver: bridge

volumes:
  nc_data:
  nc_db_data:
  letta_em_data:
  letta_researcher_data:
  letta_em_pgdata:
  letta_researcher_pgdata:
  # letta_analyst_a_data:  # Run 2
  # letta_analyst_b_data:  # Run 2
  # letta_analyst_a_pgdata:  # Run 2
  # letta_analyst_b_pgdata:  # Run 2
